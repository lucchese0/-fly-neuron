<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fly Neuron</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #010208;
  font-family: Arial, sans-serif;
  color: white;
}

#brain {
  width: 100%;
  height: 100%;
  display: block;
}

#panel {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 10;

  padding: 16px 18px;

  background: rgba(4, 7, 16, 0.82);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 14px;

  backdrop-filter: blur(12px);
}

#panel h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
}

#panel p {
  margin: 6px 0 0;
  font-size: 12px;
  opacity: .6;
}

#status {
  position: fixed;
  bottom: 18px;
  left: 18px;

  z-index: 10;

  font-size: 12px;
  color: #75a9ff;
}

#legend {
  position: fixed;
  right: 18px;
  top: 18px;

  z-index: 10;

  padding: 12px 15px;

  background: rgba(4,7,16,.72);
  border-radius: 12px;

  font-size: 11px;
  opacity: .75;
}
</style>
</head>

<body>

<div id="panel">
  <h1>FLY NEURON</h1>
  <p>Real MaleCNS neural morphology</p>
</div>

<div id="legend">
  Janelia MaleCNS v1.0
</div>

<div id="status">
  Loading real neurons...
</div>

<canvas id="brain"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const canvas = document.getElementById("brain");
const status = document.getElementById("status");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  10000000
);

camera.position.set(0, 0, 1200);

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

const brain = new THREE.Group();

scene.add(brain);


// ==================================================
// REAL MALECNS SKELETON LOADER
// ==================================================

const BASE =
"https://storage.googleapis.com/flyem-male-cns/v1.0/segmentation/skeletons-malecns/skeletons-swc/";


// These are real MaleCNS neuron body IDs.
// DNge104 has two neurons in the official example.

const neuronIDs = [
  12781,
  556329
];


async function loadNeuron(id, color) {

  const url = BASE + id + ".swc";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(
      "Neuron " + id + " could not be loaded"
    );
  }

  const text = await response.text();

  const points = [];

  const lines = text.split("\n");

  for (const line of lines) {

    const trimmed = line.trim();

    if (
      !trimmed ||
      trimmed.startsWith("#")
    ) {
      continue;
    }

    const parts = trimmed.split(/\s+/);

    if (parts.length < 7) {
      continue;
    }

    const x = parseFloat(parts[2]);
    const y = parseFloat(parts[3]);
    const z = parseFloat(parts[4]);

    const parent =
      parseInt(parts[6]);

    points.push({
      id: parseInt(parts[0]),
      x,
      y,
      z,
      parent
    });
  }


  // ------------------------------------------------
  // Convert SWC nodes to lines
  // ------------------------------------------------

  const positions = [];

  const byID = new Map();

  for (const p of points) {
    byID.set(p.id, p);
  }


  for (const p of points) {

    if (p.parent <= 0) {
      continue;
    }

    const parent = byID.get(p.parent);

    if (!parent) {
      continue;
    }

    positions.push(
      p.x,
      p.y,
      p.z,

      parent.x,
      parent.y,
      parent.z
    );
  }


  const geometry =
    new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",

    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );


  const material =
    new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: .85
    });


  const neuron =
    new THREE.LineSegments(
      geometry,
      material
    );


  brain.add(neuron);

  return points.length;
}


// ==================================================
// LOAD REAL NEURONS
// ==================================================

async function start() {

  try {

    status.textContent =
      "Loading real MaleCNS neurons...";

    const colors = [
      0x65a8ff,
      0xb27cff
    ];

    let totalNodes = 0;

    for (
      let i = 0;
      i < neuronIDs.length;
      i++
    ) {

      const count =
        await loadNeuron(
          neuronIDs[i],
          colors[i]
        );

      totalNodes += count;

      status.textContent =
        "Loaded neuron " +
        (i + 1) +
        " / " +
        neuronIDs.length;
    }


    // ------------------------------------------------
    // CENTER AND SCALE THE REAL DATA
    // ------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(brain);

    const center =
      new THREE.Vector3();

    box.getCenter(center);

    brain.position.sub(center);


    const size =
      new THREE.Vector3();

    box.getSize(size);

    const largest =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const targetSize = 900;

    const scale =
      targetSize / largest;

    brain.scale.setScalar(scale);


    camera.position.z =
      targetSize * 1.15;


    status.textContent =
      "REAL CONNECTOME LOADED • " +
      totalNodes.toLocaleString() +
      " skeleton nodes";


  } catch (error) {

    console.error(error);

    status.textContent =
      "Neuron data could not be loaded.";
  }
}


start();


// ==================================================
// ANIMATION
// ==================================================

function animate() {

  requestAnimationFrame(animate);

  brain.rotation.y += 0.0012;

  brain.rotation.x =
    Math.sin(
      performance.now() * 0.00025
    ) * 0.04;

  renderer.render(
    scene,
    camera
  );
}

animate();


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(
  "resize",

  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
