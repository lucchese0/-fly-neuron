<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fly Neuron</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

    }


    /* =========================
       BRAIN
    ========================= */

    #brainWindow {

      position: fixed;

      inset: 0;

      overflow: hidden;

      background: #000;

    }


    #brain {

      position: absolute;

      border: 0;

      width: 145%;
      height: 145%;

      left: -22.5%;
      top: -22.5%;

    }


    /* =========================
       DARK OVERLAY
    ========================= */

    #shade {

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.35),
          transparent 22%,
          transparent 75%,
          rgba(0,0,0,.45)
        );

      z-index: 5;

    }


    /* =========================
       MAIN CARD
    ========================= */

    #card {

      position: fixed;

      top: 24px;

      left: 24px;

      z-index: 20;

      width: 310px;

      padding: 22px;

      border-radius: 18px;

      background:
        rgba(8,8,10,.88);

      border:
        1px solid
        rgba(255,255,255,.15);

      backdrop-filter:
        blur(14px);

    }


    #title {

      font-size: 28px;

      font-weight: 700;

      letter-spacing: 4px;

    }


    #subtitle {

      margin-top: 7px;

      font-size: 14px;

      color: #aaa;

      line-height: 1.4;

    }


    #description {

      margin-top: 18px;

      font-size: 13px;

      color: #999;

      line-height: 1.55;

    }


    /* =========================
       STATUS
    ========================= */

    #status {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 18px;

      font-size: 12px;

      color: #aaa;

    }


    #dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #65d6a0;

      box-shadow:
        0 0 10px
        rgba(101,214,160,.7);

    }


    /* =========================
       SIMPLE CONTROLS
    ========================= */

    #controls {

      position: fixed;

      left: 24px;

      bottom: 24px;

      z-index: 20;

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

    }


    .button {

      padding:
        11px
        15px;

      border-radius: 10px;

      border:
        1px solid
        rgba(255,255,255,.14);

      background:
        rgba(8,8,10,.85);

      color: #bbb;

      font-size: 12px;

      backdrop-filter:
        blur(10px);

    }


    /* =========================
       HELP
    ========================= */

    #help {

      position: fixed;

      right: 24px;

      bottom: 24px;

      z-index: 20;

      padding:
        11px
        15px;

      border-radius: 10px;

      background:
        rgba(8,8,10,.82);

      border:
        1px solid
        rgba(255,255,255,.12);

      color: #999;

      font-size: 12px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #card {

        top: 16px;

        left: 16px;

        width:
          calc(100% - 32px);

        padding: 18px;

      }


      #title {

        font-size: 24px;

      }


      #description {

        margin-top: 12px;

        font-size: 12px;

      }


      #controls {

        left: 16px;

        bottom: 16px;

      }


      #help {

        right: 16px;

        bottom: 16px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       REAL MALE CNS
  ========================== -->

  <div id="brainWindow">

    <iframe
      id="brain"
      src="https://neuroglancer-demo.appspot.com/#!gs://flyem-male-cns/v1.0/male-cns-v1.0.json"
      allow="fullscreen"
    ></iframe>

  </div>


  <div id="shade"></div>


  <!-- =========================
       SIMPLE INFORMATION
  ========================== -->

  <div id="card">

    <div id="title">
      FLY NEURON
    </div>


    <div id="subtitle">
      Dijital Meyve Sineği Beyni
    </div>


    <div id="description">

      Gerçek bir meyve sineğinin
      sinir sistemi bağlantılarını
      keşfet.

      <br><br>

      Beyindeki noktalar ve bağlantılar,
      sinir hücrelerinin birbirleriyle
      nasıl iletişim kurduğunu gösterir.

    </div>


    <div id="status">

      <span id="dot"></span>

      Gerçek MaleCNS verisi

    </div>

  </div>


  <!-- =========================
       SIMPLE INFO BUTTONS
  ========================== -->

  <div id="controls">

    <div class="button">
      🧠 Beyin
    </div>

    <div class="button">
      ⚡ Aktivite
    </div>

    <div class="button">
      🔬 Nöron
    </div>

  </div>


  <!-- =========================
       HELP
  ========================== -->

  <div id="help">

    Sürükle: incele
    ·
    İki parmak: yakınlaştır

  </div>


</body>

</html>
