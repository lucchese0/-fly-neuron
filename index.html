<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fly Neuron</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    #brain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;

      width: 280px;
      padding: 20px;

      border: 1px solid rgba(255,255,255,.16);
      border-radius: 16px;

      background: rgba(8,8,10,.82);
      backdrop-filter: blur(14px);
    }

    #title {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #subtitle {
      margin-top: 7px;
      color: #aaa;
      font-size: 13px;
    }

    #status {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    #badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 9px;

      border-radius: 7px;

      background: rgba(80,180,255,.12);

      color: #72cfff;
      font-size: 11px;
    }

    #bottom {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;

      padding: 9px 13px;

      border-radius: 8px;

      background: rgba(5,5,6,.75);

      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!--
    REAL MALE CNS NEUROGLANCER
    Janelia / HHMI FlyEM
  -->

  <iframe
    id="brain"
    src="https://neuroglancer-demo.appspot.com/#!gs://flyem-male-cns/v1.0/male-cns-v1.0.json"
    allow="fullscreen"
  ></iframe>


  <div id="panel">

    <div id="title">
      FLY NEURON
    </div>

    <div id="subtitle">
      Digital Male Drosophila Brain
    </div>

    <div id="status">
      Real MaleCNS v1.0 connectome
      <br>
      166,700 neurons
      <br>
      11,710 neuron types
    </div>

    <div id="badge">
      REAL CONNECTOME
    </div>

  </div>


  <div id="bottom">
    Janelia MaleCNS v1.0 · Real neural data
  </div>

</body>
</html>
