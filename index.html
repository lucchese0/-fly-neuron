<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fly Neuron</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020203;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;

      padding: 18px 20px;

      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;

      background: rgba(8,8,10,0.78);
      backdrop-filter: blur(12px);

      min-width: 250px;
    }

    #title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    #subtitle {
      margin-top: 7px;
      color: #aaa;
      font-size: 13px;
    }

    #status {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
    }

    #info {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 10;

      padding: 9px 13px;

      border-radius: 8px;

      background: rgba(5,5,6,0.7);

      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="title">FLY NEURON</div>

    <div id="subtitle">
      Real MaleCNS neural morphology
    </div>

    <div id="status">
      Loading neurons...
    </div>
  </div>

  <div id="info">
    Janelia MaleCNS v1.0 · Drag to rotate · Pinch to zoom
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>

    /* =========================
       THREE.JS SETUP
    ========================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      100000
    );

    camera.position.set(0, 0, 700);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setClearColor(0x020203, 1);

    document.body.appendChild(renderer.domElement);


    /* =========================
       BRAIN CONTAINER
    ========================= */

    const brain = new THREE.Group();

    scene.add(brain);


    /* =========================
       REAL MALecns NEURONS
    ========================= */

    const neuronIDs = [
      12781,
      556329
    ];


    const lineMaterials = [

      new THREE.LineBasicMaterial({
        color: 0x55ccff,
        transparent: true,
        opacity: 0.9
      }),

      new THREE.LineBasicMaterial({
        color: 0xff66cc,
        transparent: true,
        opacity: 0.9
      })

    ];


    const pointMaterials = [

      new THREE.PointsMaterial({
        color: 0x8de3ff,
        size: 2.8,
        sizeAttenuation: false,
        transparent: true,
        opacity: 0.95
      }),

      new THREE.PointsMaterial({
        color: 0xff8ddd,
        size: 2.8,
        sizeAttenuation: false,
        transparent: true,
        opacity: 0.95
      })

    ];


    /* =========================
       SWC PARSER
    ========================= */

    function parseSWC(text) {

      const nodes = [];

      const lines = text.split(/\r?\n/);

      for (const line of lines) {

        const trimmed = line.trim();

        if (!trimmed) continue;

        if (trimmed.startsWith("#")) {
          continue;
        }

        const parts =
          trimmed.split(/\s+/);

        if (parts.length < 7) {
          continue;
        }

        const id =
          Number(parts[0]);

        const x =
          Number(parts[2]);

        const y =
          Number(parts[3]);

        const z =
          Number(parts[4]);

        const radius =
          Number(parts[5]);

        const parent =
          Number(parts[6]);

        if (
          Number.isFinite(id) &&
          Number.isFinite(x) &&
          Number.isFinite(y) &&
          Number.isFinite(z) &&
          Number.isFinite(parent)
        ) {

          nodes.push({
            id,
            x,
            y,
            z,
            radius,
            parent
          });

        }

      }

      return nodes;
    }


    /* =========================
       CREATE NEURON
    ========================= */

    function createNeuron(
      nodes,
      lineMaterial,
      pointMaterial
    ) {

      const nodeMap =
        new Map();

      for (const node of nodes) {

        nodeMap.set(
          node.id,
          node
        );

      }


      /* ---- BRANCH LINES ---- */

      const linePositions = [];


      for (const node of nodes) {

        if (node.parent < 0) {
          continue;
        }

        const parent =
          nodeMap.get(node.parent);

        if (!parent) {
          continue;
        }


        linePositions.push(

          node.x,
          node.y,
          node.z,

          parent.x,
          parent.y,
          parent.z

        );

      }


      const lineGeometry =
        new THREE.BufferGeometry();

      lineGeometry.setAttribute(
        "position",

        new THREE.Float32BufferAttribute(
          linePositions,
          3
        )
      );


      const lines =
        new THREE.LineSegments(
          lineGeometry,
          lineMaterial
        );


      /* ---- NEURON POINTS ---- */

      const pointPositions = [];


      for (const node of nodes) {

        pointPositions.push(
          node.x,
          node.y,
          node.z
        );

      }


      const pointGeometry =
        new THREE.BufferGeometry();

      pointGeometry.setAttribute(
        "position",

        new THREE.Float32BufferAttribute(
          pointPositions,
          3
        )
      );


      const points =
        new THREE.Points(
          pointGeometry,
          pointMaterial
        );


      /* ---- GROUP ---- */

      const neuronGroup =
        new THREE.Group();

      neuronGroup.add(lines);
      neuronGroup.add(points);

      neuronGroup.userData.nodeCount =
        nodes.length;

      return neuronGroup;
    }


    /* =========================
       LOAD NEURON
    ========================= */

    async function loadNeuron(
      id,
      index
    ) {

      try {

        const response =
          await fetch(
            "/api/neuron?id=" + id
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const text =
          await response.text();


        const nodes =
          parseSWC(text);


        if (nodes.length === 0) {

          throw new Error(
            "No SWC nodes found"
          );

        }


        const neuron =
          createNeuron(
            nodes,
            lineMaterials[index],
            pointMaterials[index]
          );


        brain.add(neuron);


        console.log(
          "Neuron",
          id,
          "loaded:",
          nodes.length,
          "nodes"
        );


        return true;

      }

      catch (error) {

        console.error(
          "Neuron",
          id,
          "failed:",
          error
        );

        return false;

      }

    }


    /* =========================
       CENTER AND SCALE BRAIN
    ========================= */

    function fitBrain() {

      const box =
        new THREE.Box3()
          .setFromObject(brain);


      if (box.isEmpty()) {
        return;
      }


      const center =
        new THREE.Vector3();

      box.getCenter(center);


      /* Move geometry to origin */

      brain.position.x =
        -center.x;

      brain.position.y =
        -center.y;

      brain.position.z =
        -center.z;


      const size =
        new THREE.Vector3();

      box.getSize(size);


      const largest =
        Math.max(
          size.x,
          size.y,
          size.z
        );


      if (
        !Number.isFinite(largest) ||
        largest <= 0
      ) {
        return;
      }


      /* Make brain a comfortable size */

      const targetSize =
        420;


      const scale =
        targetSize / largest;


      brain.scale.set(
        scale,
        scale,
        scale
      );


      camera.position.set(
        0,
        0,
        650
      );


      camera.lookAt(
        0,
        0,
        0
      );

    }


    /* =========================
       LOAD BRAIN
    ========================= */

    async function loadBrain() {

      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        "Loading real MaleCNS neurons...";


      let loaded = 0;


      for (
        let i = 0;
        i < neuronIDs.length;
        i++
      ) {

        const success =
          await loadNeuron(
            neuronIDs[i],
            i
          );


        if (success) {
          loaded++;
        }

      }


      if (loaded === 0) {

        status.textContent =
          "Neuron data could not be loaded.";

        return;

      }


      fitBrain();


      let totalNodes = 0;


      brain.traverse(
        object => {

          if (
            object.userData &&
            object.userData.nodeCount
          ) {

            totalNodes +=
              object.userData.nodeCount;

          }

        }
      );


      status.textContent =
        loaded +
        " real neurons loaded · " +
        totalNodes.toLocaleString() +
        " nodes";


      animate();

    }


    /* =========================
       MOUSE / TOUCH ROTATION
    ========================= */

    let dragging = false;

    let previousX = 0;
    let previousY = 0;


    renderer.domElement.addEventListener(
      "pointerdown",
      event => {

        dragging = true;

        previousX =
          event.clientX;

        previousY =
          event.clientY;

      }
    );


    window.addEventListener(
      "pointerup",
      () => {

        dragging = false;

      }
    );


    window.addEventListener(
      "pointermove",
      event => {

        if (!dragging) {
          return;
        }


        const dx =
          event.clientX -
          previousX;

        const dy =
          event.clientY -
          previousY;


        brain.rotation.y +=
          dx * 0.008;

        brain.rotation.x +=
          dy * 0.008;


        previousX =
          event.clientX;

        previousY =
          event.clientY;

      }
    );


    /* =========================
       ZOOM
    ========================= */

    renderer.domElement.addEventListener(
      "wheel",
      event => {

        camera.position.z +=
          event.deltaY * 0.5;


        camera.position.z =
          Math.max(
            180,
            Math.min(
              1800,
              camera.position.z
            )
          );

      },
      {
        passive: true
      }
    );


    /* =========================
       TOUCH PINCH ZOOM
    ========================= */

    let touchDistance = null;


    renderer.domElement.addEventListener(
      "touchmove",
      event => {

        if (
          event.touches.length !== 2
        ) {
          return;
        }


        const a =
          event.touches[0];

        const b =
          event.touches[1];


        const dx =
          a.clientX -
          b.clientX;

        const dy =
          a.clientY -
          b.clientY;


        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (
          touchDistance !== null
        ) {

          const difference =
            touchDistance -
            distance;


          camera.position.z +=
            difference * 1.5;


          camera.position.z =
            Math.max(
              180,
              Math.min(
                1800,
                camera.position.z
              )
            );

        }


        touchDistance =
          distance;

      },
      {
        passive: true
      }
    );


    renderer.domElement.addEventListener(
      "touchend",
      () => {

        touchDistance = null;

      }
    );


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    /* =========================
       ANIMATION
    ========================= */

    function animate() {

      requestAnimationFrame(
        animate
      );


      /* Very slow automatic rotation */

      brain.rotation.z +=
        0.0005;


      renderer.render(
        scene,
        camera
      );

    }


    /* =========================
       START
    ========================= */

    loadBrain();

  </script>

</body>
</html>
