<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fly Neuron</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      background: rgba(5,5,5,.72);
      backdrop-filter: blur(10px);
      min-width: 190px;
    }

    #title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    #subtitle {
      margin-top: 6px;
      color: #aaa;
      font-size: 12px;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
    }

    #info {
      position: fixed;
      bottom: 18px;
      left: 20px;
      z-index: 10;
      font-size: 12px;
      color: #888;
      background: rgba(5,5,5,.65);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="title">FLY NEURON</div>
    <div id="subtitle">Real MaleCNS neural morphology</div>
    <div id="status">Loading neurons...</div>
  </div>

  <div id="info">
    Janelia MaleCNS v1.0 · Drag to rotate · Scroll to zoom
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      10000
    );

    camera.position.set(0, 0, 650);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050505);

    document.body.appendChild(renderer.domElement);

    const brain = new THREE.Group();
    scene.add(brain);

    const neuronIDs = [
      12781,
      556329
    ];

    const neuronMaterials = [
      new THREE.LineBasicMaterial({
        color: 0x66ccff,
        transparent: true,
        opacity: 0.9
      }),
      new THREE.LineBasicMaterial({
        color: 0xff66cc,
        transparent: true,
        opacity: 0.9
      })
    ];

    function parseSWC(text) {
      const nodes = [];

      const lines = text.split("\n");

      for (const line of lines) {
        const trimmed = line.trim();

        if (!trimmed || trimmed.startsWith("#")) {
          continue;
        }

        const parts = trimmed.split(/\s+/);

        if (parts.length < 7) {
          continue;
        }

        const id = Number(parts[0]);
        const x = Number(parts[2]);
        const y = Number(parts[3]);
        const z = Number(parts[4]);
        const radius = Number(parts[5]);
        const parent = Number(parts[6]);

        if (
          Number.isFinite(id) &&
          Number.isFinite(x) &&
          Number.isFinite(y) &&
          Number.isFinite(z) &&
          Number.isFinite(parent)
        ) {
          nodes.push({
            id,
            x,
            y,
            z,
            radius,
            parent
          });
        }
      }

      return nodes;
    }

    function createNeuron(nodes, material) {
      const positions = [];
      const nodeMap = new Map();

      for (const node of nodes) {
        nodeMap.set(node.id, node);
      }

      for (const node of nodes) {
        if (node.parent < 0) {
          continue;
        }

        const parent = nodeMap.get(node.parent);

        if (!parent) {
          continue;
        }

        positions.push(
          node.x,
          node.y,
          node.z,

          parent.x,
          parent.y,
          parent.z
        );
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
          positions,
          3
        )
      );

      const line = new THREE.LineSegments(
        geometry,
        material
      );

      return line;
    }

    async function loadNeuron(id, material) {
      try {
        const response = await fetch(
          "/api/neuron?id=" + id
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const text = await response.text();

        const nodes = parseSWC(text);

        if (!nodes.length) {
          throw new Error(
            "No neuron nodes found"
          );
        }

        const neuron = createNeuron(
          nodes,
          material
        );

        brain.add(neuron);

        return neuron;

      } catch (error) {
        console.error(
          "Neuron " + id + " failed:",
          error
        );

        return null;
      }
    }

    async function loadBrain() {
      const status =
        document.getElementById("status");

      status.textContent =
        "Loading real neurons...";

      let loaded = 0;

      for (let i = 0; i < neuronIDs.length; i++) {

        const neuron = await loadNeuron(
          neuronIDs[i],
          neuronMaterials[i]
        );

        if (neuron) {
          loaded++;
        }
      }

      if (!loaded) {
        status.textContent =
          "Neuron data could not be loaded.";

        return;
      }

      centerBrain();

      status.textContent =
        loaded + " real neurons loaded";

      animate();
    }

    function centerBrain() {

      const box =
        new THREE.Box3().setFromObject(brain);

      const center =
        box.getCenter(new THREE.Vector3());

      brain.position.sub(center);

      const size =
        box.getSize(new THREE.Vector3());

      const maxSize =
        Math.max(
          size.x,
          size.y,
          size.z
        );

      if (maxSize > 0) {

        const scale =
          420 / maxSize;

        brain.scale.setScalar(scale);
      }

      const finalBox =
        new THREE.Box3().setFromObject(brain);

      const finalSize =
        finalBox.getSize(
          new THREE.Vector3()
        );

      const finalMax =
        Math.max(
          finalSize.x,
          finalSize.y,
          finalSize.z
        );

      camera.position.z =
        Math.max(450, finalMax * 1.8);
    }

    let mouseDown = false;
    let lastX = 0;
    let lastY = 0;

    renderer.domElement.addEventListener(
      "pointerdown",
      event => {
        mouseDown = true;
        lastX = event.clientX;
        lastY = event.clientY;
      }
    );

    window.addEventListener(
      "pointerup",
      () => {
        mouseDown = false;
      }
    );

    window.addEventListener(
      "pointermove",
      event => {

        if (!mouseDown) {
          return;
        }

        const dx =
          event.clientX - lastX;

        const dy =
          event.clientY - lastY;

        brain.rotation.y +=
          dx * 0.008;

        brain.rotation.x +=
          dy * 0.008;

        lastX = event.clientX;
        lastY = event.clientY;
      }
    );

    renderer.domElement.addEventListener(
      "wheel",
      event => {

        camera.position.z +=
          event.deltaY * 0.5;

        camera.position.z =
          Math.max(
            150,
            Math.min(
              camera.position.z,
              2000
            )
          );
      },
      { passive: true }
    );

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      }
    );

    function animate() {

      requestAnimationFrame(animate);

      brain.rotation.z += 0.0008;

      renderer.render(
        scene,
        camera
      );
    }

    loadBrain();
  </script>

</body>
</html>
